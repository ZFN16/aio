:root{

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg)}
body{
 min-height:100vh;display:flex;flex-direction:column;color:var(--text);

 background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),

main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 0}
.panel{width:100%;max-width:760px}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:20px;color:var(--muted);
 font:500 10px/1 "SFMono-Regular",Consolas,"Liberation Mono",monospace;letter-spacing:.18em}
.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 12px rgba(120,201,158,.3)}
h1{font-size:clamp(42px,7vw,72px);line-height:.95;font-weight:500;letter-spacing:-.06em}

.subtitle{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.5}
.status-card{margin-top:26px;padding:22px;background:rgba(18,20,25,.94);border:1px solid var(--border);border-radius:8px}
.status-head{display:flex;justify-content:space-between;gap:20px;align-items:center}
.label{color:var(--subtle);font:500 9px/1 "SFMono-Regular",Consolas,"Liberation Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.badge{padding:6px 9px;border:1px solid rgba(120,201,158,.3);border-radius:4px;color:var(--success);
 font:500 9px/1 "SFMono-Regular",Consolas,"Liberation Mono",monospace;letter-spacing:.1em}
#msgs2{margin-top:13px;color:var(--text);font-size:16px;line-height:1.5}
#msgs{margin-top:10px;color:var(--muted);font:11px/1.6 "SFMono-Regular",Consolas,"Liberation Mono",monospace}

.progress-line:after{content:"";display:block;width:38%;height:100%;background:var(--blue);animation:scan 1.3s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}
.footer{padding:16px 0 21px;border-top:1px solid var(--border);color:var(--subtle);text-align:center;
 font:10px/1.5 "SFMono-Regular",Consolas,"Liberation Mono",monospace}
@media(max-width:600px){

 main{padding:30px 0}
